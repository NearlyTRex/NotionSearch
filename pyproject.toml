[build-system]
requires = ["setuptools>=77"]  # PEP 639 license fields
build-backend = "setuptools.build_meta"

[project]
name = "notionsearch"
version = "0.1.0"
description = "A local search engine for your own Notion workspace"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["notion", "search", "meilisearch", "self-hosted"]
classifiers = [
    "Private :: Do Not Upload",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
]
# Runtime dependencies live in requirements.txt, which stays the single source of
# truth: the container installs from it directly, which keeps them in their own
# cached Docker layer.
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.urls]
Documentation = "https://github.com/NearlyTRex/NotionSearch/blob/main/docs/README.md"
Source = "https://github.com/NearlyTRex/NotionSearch"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
# This file sits at the project root, so pytest finds it from the root *and* from
# tests/ (config discovery walks upward). One config, every invocation.
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    'integration: runs the real stack (uvicorn + Meilisearch + stand-in Notion). Deselect with -m "not integration".',
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Enforced in CI against tests/unit. The integration tier runs the app in a
# separate process, so it cannot contribute in-process coverage — it proves
# behaviour end to end instead.
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "C4",       # comprehension clarity
    "UP",       # outdated syntax
    "SIM",      # simplifiable code
    "RUF",      # ruff's own checks
]
ignore = [
    "E501",     # line length is handled by the formatter
    "B008",     # FastAPI's Depends()/Query() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers deliberately, and fixtures shadow names.
"tests/*" = ["S101", "SIM117"]
