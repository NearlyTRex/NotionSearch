name: Release

# Stage two of a release. When the version in pyproject.toml has no tag yet, it
# builds the Windows installer at that version, smoke-tests it, then tags this
# commit and publishes a GitHub Release with the installer and its checksum
# attached. Pushes that don't change the version find the tag already there, and
# build nothing.
#
# To release: Actions -> Prepare Release -> Run workflow, then merge its PR.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  pending:
    name: Pending
    uses: NearlyTRex/Workflows/.github/workflows/release-check.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read
    with:
      version-file: pyproject.toml

  # The same tests as CI. Release PRs are opened with the workflow token, which
  # doesn't trigger CI, so this is where a release commit gets tested.
  check:
    name: Check
    needs: pending
    if: needs.pending.outputs.pending == 'true'
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read
    with:
      python-version: "3.14"
      commands: .github/scripts/with-meilisearch.sh python -m pytest tests/integration -q
      test-command: pytest -q tests/unit tests/tools

  installer:
    name: Installer
    needs: pending
    if: needs.pending.outputs.pending == 'true'
    uses: NearlyTRex/Workflows/.github/workflows/inno-setup.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read
    with:
      script: packaging/windows/notionsearch.iss
      version: ${{ needs.pending.outputs.version }}
      # Installs it silently and checks the result actually works, not just
      # that it compiled: the installer is the first thing a user runs.
      smoke-test: .github\scripts\smoke-test-installer.ps1
      artifact: installer

  # Signs build provenance for the installer, so a download can be checked with
  # gh attestation verify.
  attest:
    name: Attest
    needs: [installer]
    uses: NearlyTRex/Workflows/.github/workflows/attest.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      id-token: write
      attestations: write
    with:
      artifacts: installer

  release:
    name: Release
    needs: [check, attest, installer]
    uses: NearlyTRex/Workflows/.github/workflows/release.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: write
    with:
      version-file: pyproject.toml
      assets: installer
      checksums: true
      # Install steps for Windows and Linux/macOS, above the generated notes.
      notes-file: .github/release-notes.md
