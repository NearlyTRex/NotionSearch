name: CI

# Tests and lint come from the shared NearlyTRex/Workflows library, so a fix or
# tool update there reaches this repo through one Dependabot bump. Only the jobs
# specific to this project (the Docker stack and the Windows installer) live
# here, and their logic is in .github/scripts/ so it runs locally exactly as
# CI runs it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing in CI needs to write to the repository. Without
# this the workflow inherits the repository default, which is often read/write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@189a9c599b51396d09f95469f00b561da645ded1 # v0.2.7
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The oldest version pyproject.toml allows, and the one the container
        # ships. Testing only the floor would leave the code that actually runs
        # untested.
        python: ["3.12", "3.14"]
    with:
      python-version: ${{ matrix.python }}
      # Starts Meilisearch at the version docker-compose.yml ships, exports its
      # settings to the coverage run below, and runs the integration tier. That
      # tier drives the app in a separate process, so it cannot contribute
      # in-process coverage; it proves behaviour end to end instead.
      commands: .github/scripts/with-meilisearch.sh python -m pytest tests/integration -q
      # Every line and branch of the app, the scripts and the repo tooling, as
      # listed under [tool.coverage] in pyproject.toml. The library's default
      # gate is 100%.
      test-command: pytest -q tests/unit tests/tools

  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@189a9c599b51396d09f95469f00b561da645ded1 # v0.2.7
    permissions:
      contents: read

  # The stack as users run it: builds the image, starts it with Meilisearch,
  # waits for both to report healthy, then checks the UI is served and the app
  # dropped root. Logs are printed if anything fails.
  docker:
    name: Docker stack
    uses: NearlyTRex/Workflows/.github/workflows/compose-test.yml@189a9c599b51396d09f95469f00b561da645ded1 # v0.2.7
    permissions:
      contents: read
    with:
      compose-file: docker/docker-compose.yml
      health-url: http://localhost:8080/health
      commands: |
        .github/scripts/check-endpoints.sh
        .github/scripts/check-not-root.sh

  # Compiled on every change so a broken .iss is caught here rather than at
  # release time, when it would block shipping. The version is a placeholder;
  # release.yml builds the real one.
  installer:
    name: Windows installer
    uses: NearlyTRex/Workflows/.github/workflows/inno-setup.yml@189a9c599b51396d09f95469f00b561da645ded1 # v0.2.7
    permissions:
      contents: read
    with:
      script: packaging/windows/notionsearch.iss
      version: 0.0.0-ci
      smoke-test: .github\scripts\smoke-test-installer.ps1
