name: CI

# Steps with real logic live in .github/scripts/ so they can be run locally,
# exactly as CI runs them, and linted. Only one-liners stay inline.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.11
        ports:
          - 7700:7700
        env:
          MEILI_MASTER_KEY: testkey1234567890
          MEILI_NO_ANALYTICS: "true"
          MEILI_ENV: development
        options: >-
          --health-cmd "curl -f http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      MEILI_URL: http://127.0.0.1:7700
      MEILI_MASTER_KEY: testkey1234567890
      # Turn a missing search engine into a failure instead of a silent skip:
      # a green run that skipped the search tests is not a passing build.
      REQUIRE_MEILI: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint Python
        run: python -m ruff check app/ tests/ .github/scripts/

      # Actions must be pinned to immutable commit SHAs: a tag can be moved to
      # point at different code. Offline, so it never fails on a rate limit and
      # never goes red merely because upstream published a release.
      - name: Actions are pinned to commit SHAs
        run: python .github/scripts/pin-actions.py --check

      # Shell scripts are on the critical path: the container entrypoint decides
      # whether the app can start at all.
      - name: Lint shell scripts
        run: .github/scripts/shellcheck-all.sh

      # Coverage is enforced against the unit tier only. The integration tier
      # runs the app in a separate process, so it cannot contribute in-process
      # coverage — it proves behaviour end to end instead.
      # fail_under = 100 lives in pyproject.toml, so this fails the build if a
      # single statement or branch goes untested.
      - name: Unit tests and 100% coverage gate
        run: python -m pytest tests/unit -q --cov

      - name: Integration tests
        run: python -m pytest tests/integration -q

      - name: Repository tooling tests
        run: python -m pytest tests/tools -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Note this runner checks out as uid 1001, not 1000. That is deliberate
      # cover: the container adopts whoever owns ./data, and this job is what
      # would catch a regression back to a hard-coded user id.
      - name: Build and start the stack
        working-directory: docker
        run: docker compose up -d --build

      - name: Wait for it to become healthy
        run: .github/scripts/wait-for-health.sh

      - name: Check the UI and its assets are served
        run: .github/scripts/check-endpoints.sh

      - name: Confirm the app is not running as root
        run: |
          uid=$(docker compose -f docker/docker-compose.yml exec -T api \
                  sh -c 'grep ^Uid: /proc/1/status | cut -f2')
          echo "app runs as uid $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::the app is running as root; it should adopt the data folder owner"
            exit 1
          fi

      - name: Stop
        if: always()
        working-directory: docker
        run: docker compose down -v

  installer:
    name: Windows installer compiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Compile on every change so a broken .iss is caught here rather than at
      # release time, when it would block shipping.
      - name: Compile the installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=0.0.0-ci packaging\windows\notionsearch.iss

      - name: Smoke-test the installer
        run: .github\scripts\smoke-test-installer.ps1
        shell: pwsh
