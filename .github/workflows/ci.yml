name: CI

# Tests and lint come from the shared NearlyTRex/Workflows library, so a fix or
# tool update there reaches this repo through one Dependabot bump. Only the jobs
# specific to this project (the Docker stack and the Windows installer) live
# here, and their logic is in .github/scripts/ so it runs locally exactly as
# CI runs it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing in CI needs to write to the repository. Without
# this the workflow inherits the repository default, which is often read/write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    uses: NearlyTRex/Workflows/.github/workflows/python-ci.yml@53a4d8dcd0b519a0fa7cd9c0b92b87057a740e0e # dev/container-config-scan (repin to v0.2.4 once released)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The oldest version pyproject.toml allows, and the one the container
        # ships. Testing only the floor would leave the code that actually runs
        # untested.
        python: ["3.12", "3.14"]
    with:
      python-version: ${{ matrix.python }}
      # Starts Meilisearch at the version docker-compose.yml ships, exports its
      # settings to the coverage run below, and runs the integration tier. That
      # tier drives the app in a separate process, so it cannot contribute
      # in-process coverage; it proves behaviour end to end instead.
      commands: .github/scripts/with-meilisearch.sh python -m pytest tests/integration -q
      # Every line and branch of the app, the scripts and the repo tooling, as
      # listed under [tool.coverage] in pyproject.toml. The library's default
      # gate is 100%.
      test-command: pytest -q tests/unit tests/tools

  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@53a4d8dcd0b519a0fa7cd9c0b92b87057a740e0e # dev/container-config-scan (repin to v0.2.4 once released)
    permissions:
      contents: read

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Note this runner checks out as uid 1001, not 1000. That is deliberate
      # cover: the container adopts whoever owns ./data, and this job is what
      # would catch a regression back to a hard-coded user id.
      - name: Build and start the stack
        working-directory: docker
        run: docker compose up -d --build

      - name: Wait for it to become healthy
        run: .github/scripts/wait-for-health.sh

      - name: Check the UI and its assets are served
        run: .github/scripts/check-endpoints.sh

      - name: Confirm the app is not running as root
        run: |
          uid=$(docker compose -f docker/docker-compose.yml exec -T api \
                  sh -c 'grep ^Uid: /proc/1/status | cut -f2')
          echo "app runs as uid $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::the app is running as root; it should adopt the data folder owner"
            exit 1
          fi

      - name: Stop
        if: always()
        working-directory: docker
        run: docker compose down -v

  installer:
    name: Windows installer compiles
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Compile on every change so a broken .iss is caught here rather than at
      # release time, when it would block shipping.
      - name: Compile the installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=0.0.0-ci packaging\windows\notionsearch.iss

      - name: Smoke-test the installer
        run: .github\scripts\smoke-test-installer.ps1
        shell: pwsh
