name: Security

# Supply-chain, secret and static analysis checks, from the shared
# NearlyTRex/Workflows library. Kept separate from ci.yml so a scanner going red
# on something outside your control never blocks a code review, and run weekly
# so vulnerabilities disclosed after a commit landed are still caught.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 06:17 UTC. Off the hour, because everything scheduled on the hour
    # queues behind everyone else's jobs.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # zizmor over the workflows, gitleaks over the whole git history (with the
  # Notion token rules in .gitleaks.toml), and pip-audit over the hash-locked
  # runtime dependencies.
  security:
    name: Security
    uses: NearlyTRex/Workflows/.github/workflows/security.yml@0dd8e56278d822277ecd6fd06f12b24c3814d84f # v0.2.6
    permissions:
      contents: read
    with:
      pip-audit-files: requirements.txt

  codeql:
    name: CodeQL
    uses: NearlyTRex/Workflows/.github/workflows/codeql.yml@0dd8e56278d822277ecd6fd06f12b24c3814d84f # v0.2.6
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # The app and scripts, web/app.js, and the workflows themselves.
      languages: '["python", "javascript-typescript", "actions"]'

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    uses: NearlyTRex/Workflows/.github/workflows/dependency-review.yml@0dd8e56278d822277ecd6fd06f12b24c3814d84f # v0.2.6
    permissions:
      contents: read

  # Fails on fixable HIGH/CRITICAL CVEs in the image, and on misconfigurations
  # in docker/. Deliberate exceptions are listed, with the reason, in
  # .trivyignore.
  container-scan:
    name: Container Scan
    uses: NearlyTRex/Workflows/.github/workflows/container-scan.yml@0dd8e56278d822277ecd6fd06f12b24c3814d84f # v0.2.6
    permissions:
      contents: read
    with:
      dockerfile: docker/Dockerfile
      context: .
      config-scan: true

  # Complements gitleaks: it scans contents, this checks that whole categories
  # of file (.env, *.db, keys) are never committed at all. The app keeps the
  # Notion token in data/notionsearch.db, and a binary SQLite file is not
  # something a content scanner reliably flags.
  tracked-files:
    name: No credential-bearing files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: .github/scripts/check-no-secrets.sh
