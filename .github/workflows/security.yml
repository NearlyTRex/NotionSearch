name: Security

# Supply-chain, secret and static analysis checks, from the shared
# NearlyTRex/Workflows library. Kept separate from ci.yml so a scanner going red
# on something outside your control never blocks a code review, and run weekly
# so vulnerabilities disclosed after a commit landed are still caught.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 06:17 UTC. Off the hour, because everything scheduled on the hour
    # queues behind everyone else's jobs.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  # Only pull requests: a newer push supersedes their run. On main every run
  # finishes, since each push's secret scan covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # zizmor over the workflows, gitleaks over the whole git history (with the
  # Notion token rules in .gitleaks.toml), and pip-audit over the hash-locked
  # runtime dependencies.
  security:
    name: Security
    uses: NearlyTRex/Workflows/.github/workflows/security.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read
    with:
      pip-audit-files: requirements.txt
      # On top of the library's defaults (.env files, private keys): the app
      # keeps the Notion token in data/notionsearch.db, and a binary SQLite
      # file is not something a content scanner reliably flags. data/ itself
      # should only ever hold .gitkeep.
      tracked-files-patterns: "*.db *.db-shm *.db-wal *.sqlite *.sqlite3 data/* !data/.gitkeep"

  codeql:
    name: CodeQL
    uses: NearlyTRex/Workflows/.github/workflows/codeql.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # The app and scripts, web/app.js, and the workflows themselves.
      languages: '["python", "javascript-typescript", "actions"]'

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    uses: NearlyTRex/Workflows/.github/workflows/dependency-review.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read

  # Fails on fixable HIGH/CRITICAL CVEs in the image, and on misconfigurations
  # in docker/. Deliberate exceptions are listed, with the reason, in
  # .trivyignore.
  container-scan:
    name: Container Scan
    uses: NearlyTRex/Workflows/.github/workflows/container-scan.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read
    with:
      dockerfile: docker/Dockerfile
      context: .
      config-scan: true
