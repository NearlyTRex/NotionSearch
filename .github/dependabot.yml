version: 2

# Weekly, grouped, and 7 days behind upstream releases so a compromised release
# has time to be caught before it is proposed here.
updates:
  # Workflow actions, including the NearlyTRex/Workflows library pin. Both are
  # pinned to commit SHAs; Dependabot reads the trailing "# v0.2.4" comment to
  # know the version and updates both together.
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  # Python runtime dependencies. Only the hash-locked requirements.txt moves;
  # the pins in requirements.in stay as written, so bumping one past its pin is
  # a deliberate edit.
  - package-ecosystem: pip
    directories: ["/"]
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  # The container base image (python:3.14-alpine). Base-layer CVEs are the ones
  # the image scan flags, and a rebuild is the only thing that clears them.
  - package-ecosystem: docker
    directories: ["/docker"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "docker"

  # Meilisearch, which is named in docker-compose.yml rather than a Dockerfile.
  # CI reads the version from there, so a bump here is tested before it lands.
  - package-ecosystem: docker-compose
    directories: ["/docker"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        patterns: ["*"]
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "docker"
