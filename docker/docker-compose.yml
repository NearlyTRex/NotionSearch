name: notionsearch

services:
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: notionsearch-meili
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-notionsearch_local_key_change_me}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    # Not published to the host: only the api container needs to reach it.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: notionsearch-api
    # Run as you, not root, so ./data stays readable and backup-able without
    # sudo. 1000:1000 is the first user on most Linux desktops; override in
    # .env if `id -u` says otherwise.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # Bound to localhost so the app is never exposed to your network.
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-notionsearch_local_key_change_me}
      NOTIONSEARCH_DATA: /data
      APP_PASSWORD: ${APP_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Your synced pages and API key live here. This folder is the backup.
      - ../data:/data
    depends_on:
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  meili_data:
